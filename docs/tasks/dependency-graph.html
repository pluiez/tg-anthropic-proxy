<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docs/tasks 任务依赖图</title>
  <style>
    body {
      margin: 0;
      color: #172033;
      background: #f7f8fb;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 44px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      color: #647084;
      line-height: 1.6;
    }

    .frame {
      overflow-x: auto;
      background: #fff;
      border: 1px solid #e3e8f0;
      border-radius: 8px;
      box-shadow: 0 14px 34px rgba(31, 45, 71, 0.10);
      padding: 12px;
    }

    img {
      display: block;
      min-width: 820px;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>docs/tasks 任务依赖图</h1>
    <p>红色实线是强前置，蓝色虚线是推荐顺序。005 是未来任务，应该等 001、002、004 稳定后再评估。</p>
    <div class="frame">
      <img src="./dependency-graph.svg" alt="docs/tasks 任务依赖图">
    </div>
  </main>
</body>
</html>
